name: Build Mod (Forge)

on:
  push:
    branches: [Forge]
  pull_request:
    branches: [Forge]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # JANGAN pakai cache: gradle di sini (project ada di extracted/)

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: extracted

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace
        working-directory: extracted

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: interframe-forge
          path: |
            extracted/build/libs/*.jar
            !extracted/build/libs/*-sources.jar
            !extracted/build/libs/*-dev.jar
            !extracted/build/libs/*-javadoc.jar
          retention-days: 14
