name: Build Mod

on:
  push:
    branches: [main]
    paths:
      - 'extracted/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'extracted/**'
  workflow_dispatch:   # bisa dijalankan manual dari tab Actions

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: extracted

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace
        working-directory: extracted

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: interframe-mod
          path: |
            extracted/build/libs/*.jar
            !extracted/build/libs/*-sources.jar
            !extracted/build/libs/*-dev.jar
            !extracted/build/libs/*-javadoc.jar
          retention-days: 14
