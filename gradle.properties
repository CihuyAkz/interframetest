# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=false

# Fabric / Minecraft — ported to 1.21.11 (Fabric's last obfuscated release; still Mojang-mapped +
# OpenGL-only, same as 1.21.1). See PORTING_NOTES.md for exactly what changed and what still needs a
# real compile/test pass. Versions below were current per Fabric/Modrinth as of this port; check
# https://fabricmc.net/2025/12/05/12111.html and Modrinth for anything newer before building.
minecraft_version=1.21.11
loom_version=1.14-SNAPSHOT

fabric_loader_version=0.18.1
# Fabric API is only used for its lifecycle events; trim further if you don't need any of it.
fabric_api_version=0.141.1+1.21.11

# Sodium build used in the pack, Fabric variant (compile against its config API, same as the NeoForge build)
sodium_version=mc1.21.11-0.8.13-fabric

# Optional neural backend. ONNX Runtime is NOT bundled (the GPU natives are huge); it is loaded
# reflectively at runtime if the user drops it on the classpath. We only compile against it.
onnxruntime_version=1.18.0

# Mod properties
mod_version=1.3.0-fabric
maven_group=dev.fallingcloud
archives_base_name=interframe
