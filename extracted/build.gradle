plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    // Required by Mixin's annotation processor; keeps the refmap in sync with the AP output.
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                interframe {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'interframe.refmap.json'
    config 'interframe.mixins.json'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    // OptiFine standalone jar (needed only if you want to compile/test against the real OptiFine
    // classes instead of pure reflection). Optional — see README > OptiFine support.
    maven { url = 'https://maven.blamejared.com/' } // mirrors OptiFine + assorted compat jars
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // --- Optional neural frame-interpolation backend --------------------------------------------
    // Compiled against, never bundled. Loaded reflectively at runtime only if present on the
    // classpath (drop the jar + its natives into mods/ or libraries/ yourself). See README.
    compileOnly "com.microsoft.onnxruntime:onnxruntime:${project.onnxruntime_version}"

    // --- OptiFine (compile-time only, optional) --------------------------------------------------
    // We never hard-depend on OptiFine: it's closed-source and not always present. Uncomment this
    // if you want compile-time type safety in OptiFineBridge instead of pure reflection, and place
    // a matching OptiFine_<mc>_HD_U_*.jar as a flatDir/local dependency — OptiFine is not reliably
    // published to a public Maven repo. Left disabled by default so the build works out of the box.
    // compileOnly files('libs/OptiFine_1.20.1_HD_U_I7.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'interframe',
                'Specification-Vendor'    : 'falling_cloud',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'falling_cloud',
                'MixinConfigs'            : 'interframe.mixins.json'
        ])
    }
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

processResources {
    def props = ["version": project.version, "minecraft_version_range": project.minecraft_version_range,
                  "forge_version_range": project.forge_version_range]
    inputs.properties(props)
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}
