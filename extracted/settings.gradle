pluginManagement {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        gradlePluginPortal()
    }
}

plugins {
    // Lets Gradle auto-download a JDK 17 toolchain (build.gradle targets Java 17 for Forge 1.20.1)
    // even in CI environments — like this project's GitHub Actions job — that only set up JDK 21.
    // Without this, Gradle can only use whatever JDK is already on PATH/JAVA_HOME.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}
