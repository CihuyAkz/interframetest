modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"
issueTrackerURL = "https://github.com/fallingcloud/interframe"

[[mods]]
modId = "interframe"
version = "${version}"
displayName = "Interframe"
logoFile = "interframe_icon.png"
authors = "falling_cloud"
description = '''
AI frame generation for Minecraft. Captures each finished frame and synthesises in-between frames to
raise the perceived frame rate and smooth motion. Layered, graceful-degradation synthesiser: an
always-correct cross-blend, a rotational motion-reprojection ("timewarp") for the common mouse-look
case, and an optional neural RIFE backend (ONNX Runtime) for true learned interpolation. Composes with
Sodium forks (Embeddium/Rubidium), Iris and OptiFine (see README for OptiFine caveats). Hand and
hotbar/HUD are excluded from the warp so they stay crisp on synthetic frames.

Forge port note: this build targets 1.20.1 and is client-only.
'''

[[dependencies.interframe]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.interframe]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "CLIENT"

# Not a hard dependency: if Iris is installed, Interframe detects active shaderpacks reflectively and
# disables translational reprojection under them (parallax degrades to rotation-only). Load order
# doesn't matter for this — the check happens every frame at runtime, not at mod-init time.
[[dependencies.interframe]]
    modId = "iris"
    mandatory = false
    versionRange = "[1.20.1,)"
    ordering = "NONE"
    side = "CLIENT"

# Embeddium (Sodium's Forge/NeoForge fork). Also optional — see README for why the Sodium-specific
# config-menu integration from the Fabric build was replaced with a standalone Forge config screen.
[[dependencies.interframe]]
    modId = "embeddium"
    mandatory = false
    versionRange = "[0.3,)"
    ordering = "NONE"
    side = "CLIENT"
