modLoader = "javafml"
loaderVersion = "[52,)"
license = "MIT"
issueTrackerURL = "https://github.com/fallingcloud/interframe"

[[mods]]
modId = "interframe"
version = "${file.jarVersion}"
displayName = "Interframe"
logoFile = "interframe_icon.png"
authors = "falling_cloud"
description = '''AI frame generation for Minecraft. Captures each finished frame and synthesises in-between frames to raise the perceived frame rate and smooth motion. Layered, graceful-degradation synthesiser: an always-correct cross-blend, a rotational motion-reprojection ("timewarp") for the common mouse-look case, and an optional neural RIFE backend (ONNX Runtime) for true learned interpolation. Ships its own settings screen (mod list -> Config), since Sodium has no official build for this loader. Composes with Iris. Hand and hotbar/HUD are excluded from the warp so they stay crisp on synthetic frames.'''

# Mixin config declared directly in mods.toml (native Forge mixin loading, no manifest attribute needed).
[[mixins]]
config = "interframe.mixins.json"

[[dependencies.interframe]]
    modId = "forge"
    type = "required"
    versionRange = "[52,)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.interframe]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1,1.21.2)"
    ordering = "NONE"
    side = "BOTH"
