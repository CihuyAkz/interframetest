# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=false

# Fabric / Minecraft (Fabric port of the NeoForge build; same target as the dreamsfactory pack)
minecraft_version=1.21.1
loom_version=1.9-SNAPSHOT

fabric_loader_version=0.16.9
# Fabric API is only used for its lifecycle events; trim further if you don't need any of it.
fabric_api_version=0.116.0+1.21.1

# Sodium build used in the pack, Fabric variant (compile against its config API, same as the NeoForge build)
sodium_version=mc1.21.1-0.8.12-beta.2-fabric

# Optional neural backend. ONNX Runtime is NOT bundled (the GPU natives are huge); it is loaded
# reflectively at runtime if the user drops it on the classpath. We only compile against it.
onnxruntime_version=1.18.0

# Mod properties
mod_version=1.2.0-fabric
maven_group=dev.fallingcloud
archives_base_name=interframe
