# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Minecraft Forge (original/Lex's Forge, NOT NeoForge) — port of the NeoForge/Fabric builds, same target
minecraft_version=1.21.1
forge_version=52.1.0

# Optional neural backend. ONNX Runtime is NOT bundled (the GPU natives are huge); it is loaded
# reflectively at runtime if the user drops it on the classpath. We only compile against it.
onnxruntime_version=1.18.0

# Mod properties
mod_version=1.2.0-forge
maven_group=dev.fallingcloud
archives_base_name=interframe
