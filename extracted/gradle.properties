# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Forge / Minecraft (Forge port of the original Fabric/NeoForge builds)
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
# Check https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html for the latest
# 1.20.1 build before publishing; this is a known-good recent-at-time-of-writing version.
forge_version=47.3.0
forge_version_range=[47,)

# Optional neural backend. ONNX Runtime is NOT bundled (the GPU natives are huge); it is loaded
# reflectively at runtime if the user drops it on the classpath. We only compile against it.
onnxruntime_version=1.18.0

# Mod properties
mod_version=1.2.0-forge
maven_group=dev.fallingcloud
archives_base_name=interframe
